configuration:
  mqtt_host:
    name: MQTT host
    description: Hostname or address the backend uses to reach the MQTT broker.
  mqtt_port:
    name: MQTT port
    description: TCP port of the MQTT broker.
  mqtt_username:
    name: MQTT username
    description: Optional backend identity used by AppDaemon to connect to the broker.
  mqtt_password:
    name: MQTT password
    description: Optional password for the AppDaemon backend identity.
  mqtt_client_id:
    name: MQTT client ID
    description: Unique broker client ID for this backend instance.
  persist_feeder_mqtt:
    name: Persist feeder MQTT destination
    description: Explicitly write the feeder-facing broker address to the physical feeder after validation. Leave disabled to preserve its existing endpoint configuration.
  feeder_mqtt_host:
    name: Feeder MQTT host
    description: LAN-routable FQDN or address written to the physical feeder only when persistence is enabled. Never use a Home Assistant internal hostname.
  feeder_mqtt_port:
    name: Feeder MQTT port
    description: LAN broker port written to the physical feeder when persistence is enabled.
  feeder_https_addr:
    name: Feeder HTTPS address
    description: Optional HTTPS endpoint written with the feeder MQTT destination. Leave empty to omit it from the update.
  petlibro_state_agent_url:
    name: Feeder state API URL
    description: Optional read-only state-agent base URL. Leave empty to use port 8765 on each discovered feeder IP, or use {ip} in a custom per-device URL.
  petlibro_state_agent_token:
    name: Feeder state API token
    description: Bearer token configured in the feeder-side read-only state agent. It is written only to the private AppDaemon secrets file.
  petlibro_state_agent_timeout_seconds:
    name: Feeder state API timeout
    description: Per-request timeout for local feeder truth reads and write verification.
  device_discovery:
    name: Device discovery
    description: Discover feeder serials and camera UIDs from MQTT, then resolve camera addresses on the LAN.
  product_filter:
    name: Product filter
    description: Petlibro product family accepted by automatic discovery.
  lan_cidr:
    name: LAN subnet
    description: IPv4 subnet searched for camera UIDs with the local TUTK LAN protocol.
  ip_resolve_timeout_seconds:
    name: IP resolution timeout
    description: Seconds allowed for each local camera-address search.
  ip_discovery_broadcast_seconds:
    name: Discovery broadcast duration
    description: Seconds spent on low-impact broadcast discovery before subnet fallback.
  ip_discovery_max_unicast_per_second:
    name: Discovery unicast rate
    description: Maximum paced UID-specific LAN probe exchanges started per second.
  ip_refresh_interval_minutes:
    name: IP refresh interval
    description: Minutes before a healthy cached camera address is resolved again.
  ip_retry_backoff_seconds:
    name: IP retry backoff
    description: Minimum seconds between failed or unhealthy camera-address searches.
  devices:
    name: Manual device overrides
    description: Optional advanced serial, UID, and IP overrides; automatic discovery normally leaves this empty.
  go2rtc_stream_name:
    name: Stream name
    description: Name used in go2rtc and RTSP URLs.
  camera_quality:
    name: Camera quality
    description: Request the HD or SD video stream.
  go2rtc_api_port:
    name: go2rtc API port
    description: TCP port for the go2rtc web interface and API.
  go2rtc_rtsp_port:
    name: RTSP port
    description: TCP port for RTSP playback.
  go2rtc_webrtc_port:
    name: WebRTC port
    description: TCP and UDP port for WebRTC transport.
  publish_camera_metadata:
    name: Publish camera metadata
    description: Publish retained camera runtime state and availability for frontend integrations.
  camera_metadata_topic_prefix:
    name: Camera metadata topic prefix
    description: Optional MQTT prefix; leave empty to derive it from the product and serial.
  camera_metadata_interval_seconds:
    name: Camera metadata heartbeat
    description: Seconds between retained metadata heartbeat refreshes.
  verbose_logs:
    name: Legacy verbose logs
    description: Deprecated compatibility option; use log level instead.
  log_level:
    name: Log level
    description: Petlibro application logging level; trace is intentionally very noisy.
  enable_debug_dumps:
    name: Debug dumps
    description: Write sensitive decrypted protocol dumps to persistent add-on data.
network:
  1984/tcp: go2rtc web interface and API
  8554/tcp: RTSP server
  8555/tcp: WebRTC TCP transport
  8555/udp: WebRTC UDP transport
