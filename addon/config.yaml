name: Petlibro Local backend
version: "0.3.10-beta.1"
slug: petlibro_local
description: Local PLAF203 MQTT control and camera streaming backend
url: https://github.com/tannerln7/Petlibro-Home-Assistant
image: ghcr.io/tannerln7/ha-addon-petlibro-local
arch:
  - amd64
startup: application
boot: auto
stage: experimental
init: false
host_network: true
webui: http://[HOST]:[PORT:1984]/
watchdog: http://[HOST]:[PORT:1984]/
ports:
  1984/tcp: 1984
  8554/tcp: 8554
  8555/tcp: 8555
  8555/udp: 8555
ports_description:
  1984/tcp: go2rtc web interface and API
  8554/tcp: go2rtc RTSP server
  8555/tcp: go2rtc WebRTC TCP transport
  8555/udp: go2rtc WebRTC UDP transport
options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_client_id: petlibro_local_backend
  persist_feeder_mqtt: false
  feeder_mqtt_host: ""
  feeder_mqtt_port: 1883
  feeder_https_addr: ""
  petlibro_state_agent_url: ""
  petlibro_state_agent_token: ""
  petlibro_state_agent_timeout_seconds: 2
  state_agent_updates:
    enabled: false
    manifest_url: https://raw.githubusercontent.com/tannerln7/Petlibro-Home-Assistant/state-agent-releases/state-agent/latest.json
    check_on_connect: true
    check_interval_hours: 24
  device_discovery: true
  product_filter: PLAF203
  lan_cidr: 192.168.1.0/24
  ip_resolve_timeout_seconds: 15
  ip_discovery_broadcast_seconds: 2
  ip_discovery_max_unicast_per_second: 32
  ip_refresh_interval_minutes: 360
  ip_retry_backoff_seconds: 60
  devices: []
  go2rtc_stream_name: petlibro_feeder
  camera_quality: hd
  ack_mode: hybrid
  send_delay_ctrl: true
  hd_probe_wait_ms: 15000
  go2rtc_api_port: 1984
  go2rtc_rtsp_port: 8554
  go2rtc_webrtc_port: 8555
  publish_camera_metadata: true
  camera_metadata_topic_prefix: ""
  camera_metadata_interval_seconds: 30
  log_level: info
  verbose_logs: false
  enable_debug_dumps: false
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_client_id: str
  persist_feeder_mqtt: bool
  feeder_mqtt_host: str
  feeder_mqtt_port: port
  feeder_https_addr: str
  petlibro_state_agent_url: str
  petlibro_state_agent_token: password
  petlibro_state_agent_timeout_seconds: int(1,10)
  state_agent_updates:
    enabled: bool
    manifest_url: str
    check_on_connect: bool
    check_interval_hours: int(1,168)
  device_discovery: bool
  product_filter: list(PLAF203)
  lan_cidr: str
  ip_resolve_timeout_seconds: int(1,60)
  ip_discovery_broadcast_seconds: int(1,10)
  ip_discovery_max_unicast_per_second: int(1,512)
  ip_refresh_interval_minutes: int(1,10080)
  ip_retry_backoff_seconds: int(5,3600)
  devices:
    - name: str
      product: list(PLAF203)
      serial: str
      uid: str
      ip_address: str
  go2rtc_stream_name: str
  camera_quality: list(hd|sd)
  ack_mode: list(high|contig|hybrid)
  send_delay_ctrl: bool
  hd_probe_wait_ms: int(0,60000)
  go2rtc_api_port: port
  go2rtc_rtsp_port: port
  go2rtc_webrtc_port: port
  publish_camera_metadata: bool
  camera_metadata_topic_prefix: str
  camera_metadata_interval_seconds: int(5,300)
  log_level: list(critical|error|warning|info|debug|trace)
  verbose_logs: bool
  enable_debug_dumps: bool
