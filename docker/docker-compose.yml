services:
  petlibro-local:
    build:
      context: ..
      dockerfile: addon/Dockerfile
      args:
        BUILD_ARCH: amd64
        BUILD_VERSION: local
        GO_BUILD_PROCS: ${GO_BUILD_PROCS:-2}
    image: petlibro-local:local
    container_name: petlibro-local
    restart: unless-stopped
    network_mode: host
    environment:
      MQTT_HOST: ${MQTT_HOST:-192.168.1.10}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-petlibro_local_backend}
      PERSIST_FEEDER_MQTT: ${PERSIST_FEEDER_MQTT:-0}
      FEEDER_MQTT_HOST: ${FEEDER_MQTT_HOST:-}
      FEEDER_MQTT_PORT: ${FEEDER_MQTT_PORT:-1883}
      FEEDER_HTTPS_ADDR: ${FEEDER_HTTPS_ADDR:-}
      PETLIBRO_STATE_AGENT_URL: ${PETLIBRO_STATE_AGENT_URL:-}
      PETLIBRO_STATE_AGENT_TOKEN: ${PETLIBRO_STATE_AGENT_TOKEN:-}
      PETLIBRO_STATE_AGENT_TIMEOUT_SECONDS: ${PETLIBRO_STATE_AGENT_TIMEOUT_SECONDS:-2}
      STATE_AGENT_UPDATES_JSON: '${STATE_AGENT_UPDATES_JSON:-{"enabled":false,"manifest_url":"","check_on_connect":true,"check_interval_hours":24}}'
      DEVICE_DISCOVERY: ${DEVICE_DISCOVERY:-1}
      PRODUCT_FILTER: ${PRODUCT_FILTER:-PLAF203}
      LAN_CIDR: ${LAN_CIDR:-192.168.1.0/24}
      IP_RESOLVE_TIMEOUT_SECONDS: ${IP_RESOLVE_TIMEOUT_SECONDS:-15}
      IP_DISCOVERY_BROADCAST_SECONDS: ${IP_DISCOVERY_BROADCAST_SECONDS:-2}
      IP_DISCOVERY_MAX_UNICAST_PER_SECOND: ${IP_DISCOVERY_MAX_UNICAST_PER_SECOND:-32}
      IP_REFRESH_INTERVAL_MINUTES: ${IP_REFRESH_INTERVAL_MINUTES:-360}
      IP_RETRY_BACKOFF_SECONDS: ${IP_RETRY_BACKOFF_SECONDS:-60}
      DEVICES_JSON: ${DEVICES_JSON:-[]}
      GO2RTC_STREAM_NAME: ${GO2RTC_STREAM_NAME:-petlibro_feeder}
      CAMERA_QUALITY: ${CAMERA_QUALITY:-hd}
      SEND_DELAY_CTRL: ${SEND_DELAY_CTRL:-1}
      HD_PROBE_WAIT_MS: ${HD_PROBE_WAIT_MS:-15000}
      GO2RTC_API_PORT: ${GO2RTC_API_PORT:-1984}
      GO2RTC_RTSP_PORT: ${GO2RTC_RTSP_PORT:-8554}
      GO2RTC_WEBRTC_PORT: ${GO2RTC_WEBRTC_PORT:-8555}
      PUBLISH_CAMERA_METADATA: ${PUBLISH_CAMERA_METADATA:-1}
      CAMERA_METADATA_TOPIC_PREFIX: ${CAMERA_METADATA_TOPIC_PREFIX:-}
      CAMERA_METADATA_INTERVAL_SECONDS: ${CAMERA_METADATA_INTERVAL_SECONDS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VERBOSE_LOGS: ${VERBOSE_LOGS:-0}
      ENABLE_DEBUG_DUMPS: ${ENABLE_DEBUG_DUMPS:-0}
    volumes:
      - ./data:/data
