name: Publish add-on image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - .github/workflows/publish-addon-image.yml
      - addon/**
      - scripts/addon_release.py
      - state-agent/release-public-key.hex
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-addon-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare image build
    if: github.repository == 'tannerln7/Petlibro-Home-Assistant'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.normalize.outputs.description }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      image_tags: ${{ steps.release.outputs.image_tags }}
      name: ${{ steps.normalize.outputs.name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read add-on metadata
        id: info
        uses: home-assistant/actions/helpers/info@a7c616ce81ccda50150bf1595786c71b1883fabb # master
        with:
          path: ./addon

      - name: Normalize image coordinates
        id: normalize
        env:
          RAW_DESCRIPTION: ${{ steps.info.outputs.description }}
          RAW_IMAGE: ${{ steps.info.outputs.image }}
          RAW_NAME: ${{ steps.info.outputs.name }}
          RAW_URL: ${{ steps.info.outputs.url }}
          RAW_VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail

          decode_required_string() {
            jq -er 'select(type == "string" and length > 0)' <<< "$1"
          }

          image=$(decode_required_string "$RAW_IMAGE")
          description=$(decode_required_string "$RAW_DESCRIPTION")
          name=$(decode_required_string "$RAW_NAME")
          version=$(decode_required_string "$RAW_VERSION")
          url=$(jq -er 'if type == "string" then . elif . == null then "" else error("expected a string or null") end' <<< "$RAW_URL")

          if [[ "$image" != */* ]]; then
            echo "::error::Invalid image coordinate: $image"
            exit 1
          fi

          image_name=${image##*/}
          registry_prefix=${image%/*}

          {
            echo "description=$description"
            echo "image_name=$image_name"
            echo "name=$name"
            echo "registry_prefix=$registry_prefix"
            echo "url=$url"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          echo "Normalized image: ${registry_prefix}/<arch>-${image_name}:${version}"

      - name: Validate release channel
        id: release
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          python3 scripts/addon_release.py \
            --branch "$RELEASE_BRANCH" \
            --version "$RELEASE_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Reject an existing immutable version tag
        env:
          IMAGE: ${{ steps.normalize.outputs.registry_prefix }}/${{ steps.normalize.outputs.image_name }}
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::Image tag ${IMAGE}:${VERSION} already exists; increment addon/config.yaml instead of overwriting a release"
            exit 1
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: ./addon/Dockerfile
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.image_tags }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish image manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish generic image manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: ${{ needs.prepare.outputs.image_tags }}
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
